name: Render StickMan Episode 3

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow numpy

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Render Episode 3
        working-directory: "Stickman-Episode/Episode 3"
        run: |
          python main.py

      - name: Upload Episode 3 video
        uses: actions/upload-artifact@v4
        with:
          name: StickMan-Episode-3
          path: "Stickman-Episode/Episode 3/stickman_tree.mp4"
          if-no-files-found: error
